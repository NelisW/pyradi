name: pyradi
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.12
  - numpy>=2.0
  - scipy>=1.12
  - matplotlib>=3.8
  - scikit-image>=0.22      # skimage — medial_axis and image morphology
  - pillow>=10.0            # PIL — image I/O in drawCheckerboard / extractGraph
  - ipython>=8.0            # IPython — VersionInformation class, update_progress
  - pylab                   # bundled with matplotlib; listed for clarity
  - imageio>=2.28           # ryfiles — rawFrameToImageFile
  - pandas>=2.0             # ryfiles — mergeDFS
  - scikit-learn>=1.3       # ryprob — KernelDensity, GridSearchCV, LeaveOneOut
  - pytest>=7.0             # test/ regression suite
  - pip                     # required to install pip-only packages below
  - pip:
      - transformations>=2023.0  # ryscene — 3-D homogeneous transforms (Gohlke wheel)
